# Defaults only; environment-specific values come from environment variables
# (architecture/cross-cutting/configuration-and-secrets.md).
server:
  port: ${PORT:8080}

spring:
  application:
    name: task-service
  datasource:
    url: ${TODO_DB_URL:}
    username: ${TODO_DB_USER:}
    password: ${TODO_DB_PASSWORD:}
    hikari:
      connection-timeout: 5000
      data-source-properties:
        # statement timeout of 10 seconds (architecture/cross-cutting/resilience.md)
        options: "-c statement_timeout=10000"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

logging:
  structured:
    format:
      console: ecs

springdoc:
  api-docs:
    path: /v3/api-docs
